spring:
  application:
    name: pam-emailer

  task:
    scheduling:
      pool:
        # Defaults to 1. Pending/retry/delete jobs share this pool, so a slow send
        # would otherwise delay the other jobs and cause pending ticks to be skipped.
        size: 2

  datasource:
    url: ${db.jdbc.url}
    hikari:
      minimum-idle: ${db.connection.pool.size:5}
      maximum-pool-size: ${db.connection.pool.size:5}

logging:
  config: classpath:logback-prod.xml

management:
  endpoints.web.exposure.include: prometheus
  endpoint:
    prometheus.enabled: true
    metrics.enabled: true
  prometheus.metrics.export.enabled: true